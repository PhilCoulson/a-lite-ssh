name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Require signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Add repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD."
            echo "Generate them with scripts/make-release-keystore.sh"
            exit 1
          fi

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed release
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:writeUpdateMetadata --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=app/build/outputs/apk/release/version.json
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          version_name=$(python3 -c "import json; print(json.load(open('$json'))['versionName'])")
          version_code=$(python3 -c "import json; print(json.load(open('$json'))['versionCode'])")
          named="app/build/outputs/apk/release/a-lite-ssh-${version_name}.apk"
          cp -f "$apk" "$named"
          notes="A-Lite SSH ${version_name}"
          if [ "${{ github.ref_name }}" != "v${version_name}" ]; then
            echo "Tag ${{ github.ref_name }} does not match versionName v${version_name}"
            exit 1
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${version_name} (${version_code})" \
            --notes "$notes" \
            "$named" \
            "$json"
